<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cue Before / After</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #0f1012;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
        font-family: "Rajdhani", sans-serif;
        color: #e8eaf0;
        user-select: none;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: radial-gradient(ellipse 80% 60% at 50% 50%, rgba(75, 140, 245, 0.07) 0%, transparent 70%);
        pointer-events: none;
      }

      h1 {
        font-family: "Orbitron", sans-serif;
        font-size: 11px;
        letter-spacing: 0.4em;
        color: rgba(255, 255, 255, 0.25);
        text-transform: uppercase;
        margin-bottom: 32px;
        z-index: 2;
      }

      /* ── Before/After container ── */
      .ba-wrap {
        position: relative;
        width: min(88vw, 900px);
        height: min(55vw, 560px);
        z-index: 2;
        cursor: ew-resize;
        touch-action: none;
      }

      /* Both images share the same space, rotated 60° diagonal */
      .ba-img {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .ba-img img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        transform: rotate(-30deg);
        pointer-events: none;
        display: block;
      }
      #showcase-img {
        transform: translateY(-15px) rotate(105deg);
        pointer-events: none;
      }
      /* "After" (showcase) is clipped to the LEFT of the divider */
      .ba-after {
        clip-path: inset(0 50% 0 0); /* updated by JS */
        transition: clip-path 0s;
      }

      /* Divider line */
      .divider {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        width: 2px;
        background: linear-gradient(180deg, transparent 0%, #4b8cf5 20%, #00d4ff 50%, #4b8cf5 80%, transparent 100%);
        transform: translateX(-50%);
        z-index: 5;
        pointer-events: none;
      }

      /* Handle button */
      .handle {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: #0f1012;
        border: 2px solid #4b8cf5;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 6;
        box-shadow: 0 0 20px rgba(75, 140, 245, 0.5), inset 0 0 10px rgba(75, 140, 245, 0.1);
        pointer-events: none;
        transition: box-shadow 0.2s;
      }

      .handle svg {
        width: 20px;
        height: 20px;
        fill: #4b8cf5;
      }

      .ba-wrap:active .handle {
        box-shadow: 0 0 30px rgba(75, 140, 245, 0.8), inset 0 0 12px rgba(75, 140, 245, 0.2);
      }

      /* Labels */
      .label {
        position: absolute;
        bottom: -38px;
        font-family: "Orbitron", sans-serif;
        font-size: 10px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        pointer-events: none;
      }

      .label-before {
        left: 0;
        color: #4b8cf5;
      }

      .label-after {
        right: 0;
        color: rgba(255, 255, 255, 0.35);
      }

      /* Glow line at bottom */
      .gline {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, #4b8cf5 50%, transparent);
        opacity: 0.25;
      }

      /* Corner decoration */
      .corner {
        position: fixed;
        width: 40px;
        height: 40px;
        opacity: 0.25;
      }
      .corner-tl {
        top: 20px;
        left: 20px;
        border-top: 1px solid #4b8cf5;
        border-left: 1px solid #4b8cf5;
      }
      .corner-tr {
        top: 20px;
        right: 20px;
        border-top: 1px solid #4b8cf5;
        border-right: 1px solid #4b8cf5;
      }
      .corner-bl {
        bottom: 20px;
        left: 20px;
        border-bottom: 1px solid #4b8cf5;
        border-left: 1px solid #4b8cf5;
      }
      .corner-br {
        bottom: 20px;
        right: 20px;
        border-bottom: 1px solid #4b8cf5;
        border-right: 1px solid #4b8cf5;
      }
    </style>
  </head>
  <body>
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <h1>Drag to view</h1>

    <div class="ba-wrap" id="baWrap">
      <!-- BEFORE: Showcase cue (left) -->
      <div class="ba-img ba-before">
        <img id="showcase-img" src="./showcase-img.webp" alt="Showcase" />
      </div>

      <!-- AFTER: Casino MK5 (right, clipped) -->
      <div class="ba-img ba-after" id="baAfter">
        <img src="./package-img.png" alt="Package" />
      </div>

      <!-- Divider -->
      <div class="divider" id="divider"></div>
      <div class="handle" id="handle">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 5l-5 7 5 7M16 5l5 7-5 7" stroke="#4b8cf5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        </svg>
      </div>

      <span class="label label-before">Showcase</span>
      <span class="label label-after">Package</span>
    </div>

    <div class="gline"></div>

    <script>
      const wrap = document.getElementById("baWrap");
      const after = document.getElementById("baAfter");
      const divider = document.getElementById("divider");
      const handle = document.getElementById("handle");

      let pct = 50;
      let active = false;

      function setPos(x) {
        const rect = wrap.getBoundingClientRect();
        pct = Math.max(0, Math.min(100, ((x - rect.left) / rect.width) * 100));
        after.style.clipPath = "inset(0 " + (100 - pct) + "% 0 0)";
        divider.style.left = pct + "%";
        handle.style.left = pct + "%";
      }

      // Mouse
      wrap.addEventListener("mousedown", (e) => {
        active = true;
        setPos(e.clientX);
      });
      window.addEventListener("mousemove", (e) => {
        if (active) setPos(e.clientX);
      });
      window.addEventListener("mouseup", () => (active = false));

      // Touch
      wrap.addEventListener(
        "touchstart",
        (e) => {
          active = true;
          setPos(e.touches[0].clientX);
        },
        { passive: true }
      );
      wrap.addEventListener(
        "touchmove",
        (e) => {
          if (active) setPos(e.touches[0].clientX);
        },
        { passive: true }
      );
      wrap.addEventListener("touchend", () => (active = false));

      // Animate intro: slide from 80% → 50%
      let introPos = 20;
      function intro() {
        if (introPos >= 50) {
          setPos(wrap.getBoundingClientRect().left + wrap.offsetWidth * 0.5);
          return;
        }
        introPos += 0.6;
        setPos(wrap.getBoundingClientRect().left + wrap.offsetWidth * (introPos / 100));
        requestAnimationFrame(intro);
      }
      setTimeout(() => requestAnimationFrame(intro), 600);
    </script>
  </body>
</html>
